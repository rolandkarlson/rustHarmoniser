[package]
name = "rustnote-core"
version = "0.1.0"
edition = "2021"

# The pure harmonizer engine: no I/O, no async runtime, no filesystem access.
# Everything a render needs goes in through `render::render(&Config, ...)` and
# comes back in the returned RenderResult.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
fxhash = "0.2"
rayon = "1.8"
dashmap = "5.5"

[dev-dependencies]
serde_json = "1.0"
