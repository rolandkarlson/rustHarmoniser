[package]
name = "rustnote"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fxhash = "0.2"
rayon = "1.8"
dashmap = "5.5"
ratatui = "0.26"
crossterm = "0.27"
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
clap = { version = "4.5", features = ["derive"] }
webbrowser = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
